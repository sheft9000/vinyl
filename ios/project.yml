# Il progetto Xcode non esiste come file: viene generato da qui.
#
# Un .xcodeproj è un formato binario-ish pieno di UUID, impossibile da scrivere
# a mano e ingestibile in un diff. XcodeGen lo ricostruisce da questo file di
# testo, che invece si modifica da Windows senza avere Xcode.

name: SpotiJugg

options:
  bundleIdPrefix: com.gab83126
  # XcodeGen 2.45 scrive comunque objectVersion 77 (formato Xcode 16), che
  # Xcode 15 rifiuta con "Unable to read project", e ignora l'opzione che
  # dovrebbe abbassarlo. Il numero viene riscritto dal workflow subito dopo la
  # generazione: nel file non ci sono costrutti esclusivi di Xcode 16.
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  SpotiJugg:
    type: application
    platform: iOS
    sources:
      - path: SpotiJugg
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gab83126.spotijugg
        PRODUCT_NAME: SpotiJugg
        MARKETING_VERSION: "0.1.0"
        # L'icona sta in Resources/Assets.xcassets. Una sola immagine da
        # 1024x1024 basta: da Xcode 14 il sistema ricava da sola tutte le
        # misure che servono.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
        # Solo iPhone.
        TARGETED_DEVICE_FAMILY: "1"
        # Nessuna firma: l'IPA viene firmato da SideStore sul telefono.
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    info:
      path: SpotiJugg/Info.plist
      properties:
        CFBundleDisplayName: SpotiJugg
        # Senza questa chiave iOS considera l'app "legacy" e la fa girare a
        # risoluzione ridotta, scalata, con le bande nere sopra e sotto.
        # Il dizionario vuoto significa "schermata di avvio nera di sistema".
        UILaunchScreen: {}
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Riproduzione a schermo spento e comandi sulla schermata di blocco.
        UIBackgroundModes:
          - audio
        # Il server di casa parla in HTTP sulla rete locale: senza questa
        # eccezione iOS blocca ogni richiesta senza spiegare perché.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Da iOS 14 serve il consenso esplicito per la rete locale.
        NSLocalNetworkUsageDescription: >-
          SpotiJugg si collega al server musicale sulla tua rete di casa.
