# Il progetto Xcode non esiste come file: viene generato da qui.
#
# Un .xcodeproj è un formato binario-ish pieno di UUID, impossibile da scrivere
# a mano e ingestibile in un diff. XcodeGen lo ricostruisce da questo file di
# testo, che invece si modifica da Windows senza avere Xcode.

name: Vinyl

options:
  bundleIdPrefix: com.gab83126
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Vinyl:
    type: application
    platform: iOS
    sources:
      - path: Vinyl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gab83126.vinyl
        PRODUCT_NAME: Vinyl
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Solo iPhone.
        TARGETED_DEVICE_FAMILY: "1"
        # Nessuna firma: l'IPA viene firmato da SideStore sul telefono.
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    info:
      path: Vinyl/Info.plist
      properties:
        CFBundleDisplayName: Vinyl
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Riproduzione a schermo spento e comandi sulla schermata di blocco.
        UIBackgroundModes:
          - audio
        # Il server di casa parla in HTTP sulla rete locale: senza questa
        # eccezione iOS blocca ogni richiesta senza spiegare perché.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Da iOS 14 serve il consenso esplicito per la rete locale.
        NSLocalNetworkUsageDescription: >-
          Vinyl si collega al server musicale sulla tua rete di casa.
