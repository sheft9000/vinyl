# Il progetto Xcode non esiste come file: viene generato da qui.
#
# Un .xcodeproj è un formato binario-ish pieno di UUID, impossibile da scrivere
# a mano e ingestibile in un diff. XcodeGen lo ricostruisce da questo file di
# testo, che invece si modifica da Windows senza avere Xcode.

name: Vinyl

options:
  bundleIdPrefix: com.gab83126
  # XcodeGen scrive per default un formato di progetto che Xcode 15 non sa
  # leggere ("Unable to read project"). Il runner con il Simulatore iOS 17 ha
  # Xcode 15.4, quindi il formato va tenuto compatibile.
  xcodeVersion: "15.4"
  # 56 e' il formato di Xcode 14/15; il 77 di Xcode 16 non e' leggibile.
  objectVersion: 56
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Vinyl:
    type: application
    platform: iOS
    sources:
      - path: Vinyl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gab83126.vinyl
        PRODUCT_NAME: Vinyl
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Solo iPhone.
        TARGETED_DEVICE_FAMILY: "1"
        # Nessuna firma: l'IPA viene firmato da SideStore sul telefono.
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    info:
      path: Vinyl/Info.plist
      properties:
        CFBundleDisplayName: Vinyl
        # Senza questa chiave iOS considera l'app "legacy" e la fa girare a
        # risoluzione ridotta, scalata, con le bande nere sopra e sotto.
        # Il dizionario vuoto significa "schermata di avvio nera di sistema".
        UILaunchScreen: {}
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Riproduzione a schermo spento e comandi sulla schermata di blocco.
        UIBackgroundModes:
          - audio
        # Il server di casa parla in HTTP sulla rete locale: senza questa
        # eccezione iOS blocca ogni richiesta senza spiegare perché.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Da iOS 14 serve il consenso esplicito per la rete locale.
        NSLocalNetworkUsageDescription: >-
          Vinyl si collega al server musicale sulla tua rete di casa.
