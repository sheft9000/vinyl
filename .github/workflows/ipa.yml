# Costruisce l'IPA non firmato da installare con SideStore.
#
# Non c'e' nessun account sviluppatore a pagamento: l'app esce senza firma, e
# a firmarla ci pensa SideStore sul telefono con l'Apple ID gratuito. Per
# questo la compilazione disattiva del tutto la firma invece di provarci.

name: IPA per SideStore

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ipa.yml"
  workflow_dispatch:

# Serve per aggiornare la release che tiene l'IPA scaricabile dal telefono.
permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        working-directory: ios
        run: |
          xcodegen generate
          # Come per gli screenshot: XcodeGen scrive il formato di Xcode 16 e
          # Xcode 15 non lo apre.
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' Vinyl.xcodeproj/project.pbxproj

      - name: Compila per il telefono, senza firma
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Vinyl.xcodeproj \
            -scheme Vinyl \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | tail -40

      - name: Impacchetta l'IPA
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/Vinyl.app
          test -d "$APP" || { echo "Non trovo $APP"; exit 1; }
          # Un IPA e' solo uno zip con l'app dentro una cartella Payload.
          rm -rf Payload Vinyl.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Vinyl.ipa Payload
          ls -lh Vinyl.ipa

      - name: Pubblica l'IPA fra gli artefatti
        uses: actions/upload-artifact@v4
        with:
          name: Vinyl-ipa
          path: ios/Vinyl.ipa
          retention-days: 30

      - name: Aggiorna la release da cui SideStore scarica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Una sola release, sempre la stessa etichetta: l'indirizzo da cui il
          # telefono scarica non cambia mai.
          NOTE="Compilato da ${GITHUB_SHA:0:7} il $(date -u '+%d/%m/%Y %H:%M UTC').
          Non firmato: si installa con SideStore, che lo firma sul telefono."
          if gh release view ultima >/dev/null 2>&1; then
            gh release upload ultima ios/Vinyl.ipa --clobber
            gh release edit ultima --notes "$NOTE"
          else
            gh release create ultima ios/Vinyl.ipa \
              --title "Ultima build" \
              --notes "$NOTE" \
              --prerelease
          fi
          echo "### IPA: $(gh release view ultima --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
