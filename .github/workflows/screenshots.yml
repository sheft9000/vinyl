# Compila l'app e ne restituisce screenshot presi dal Simulatore iOS vero.
#
# Serve perché lo sviluppo avviene su Windows, senza Mac e senza Xcode: senza
# questo, l'aspetto dell'app si potrebbe solo immaginare. I file finiscono fra
# gli artefatti della run, scaricabili dalla pagina della Actions.

name: Screenshot iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

jobs:
  screenshots:
    # macos-latest porta Xcode 26, che ha solo i runtime del Simulatore iOS 26.
    # L'app deve girare su iOS 17: per vederla com'e' davvero serve un'immagine
    # con Xcode 15, che include il Simulatore iOS 17.
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Versione di Xcode
        run: xcodebuild -version

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        working-directory: ios
        run: |
          xcodegen generate
          # XcodeGen ignora l'opzione objectVersion e scrive 77, il formato di
          # Xcode 16. Xcode 15 non lo apre. Il progetto non usa nessun costrutto
          # introdotto da Xcode 16, quindi abbassare il numero basta.
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/'             Vinyl.xcodeproj/project.pbxproj
          grep -m1 objectVersion Vinyl.xcodeproj/project.pbxproj

      - name: Com'e' fatto il progetto generato
        working-directory: ios
        run: |
          xcodegen --version
          echo "--- intestazione del pbxproj ---"
          head -6 Vinyl.xcodeproj/project.pbxproj
          echo "--- costrutti che Xcode 15 non sa leggere ---"
          grep -c "FileSystemSynchronized" Vinyl.xcodeproj/project.pbxproj || echo "nessuno"

      - name: Prepara il simulatore uguale al telefono di destinazione
        id: sim
        run: |
          cat > /tmp/scegli_simulatore.py <<'PY'
          import json, subprocess, sys

          # Il telefono vero e' un iPhone 13 Pro Max con iOS 17.6. La geometria
          # conta: 428x926 pt e il notch, che lascia 47 pt di margine in alto.
          # Un iPhone 15 ha la Dynamic Island e 59 pt, e uno schermo piu'
          # stretto: misurare li' significa misurare un telefono che non
          # esiste in mano a nessuno.
          TELEFONO = "iPhone 13 Pro Max"
          IOS = (17, 6)
          RIPIEGHI = ["iPhone 15 Pro Max", "iPhone 15 Plus", "iPhone 14 Pro Max"]

          def leggi(*comando):
              uscita = subprocess.run(comando, capture_output=True, text=True, check=True)
              return json.loads(uscita.stdout)

          def nota(testo):
              print(testo, file=sys.stderr)

          def versione(runtime):
              pezzi = [int(p) for p in runtime["version"].split(".")[:2]]
              return (pezzi + [0])[:2]

          runtimes = [r for r in leggi("xcrun", "simctl", "list", "runtimes", "-j")["runtimes"]
                      if r["isAvailable"] and ".iOS" in r["identifier"]]
          if not runtimes:
              sys.exit("Nessun runtime iOS installato sul runner")
          nota("Runtime iOS disponibili: " + ", ".join(r["version"] for r in runtimes))

          # Il piu' vicino a 17.6. Sul runner macos-14 ci sono 17.0, 17.2, 17.4
          # e 17.5: viene scelto 17.5.
          runtime = min(runtimes, key=lambda r: (abs(versione(r)[0] - IOS[0]),
                                                 abs(versione(r)[1] - IOS[1])))

          modelli = {t["name"]: t["identifier"]
                     for t in leggi("xcrun", "simctl", "list", "devicetypes", "-j")["devicetypes"]}
          nota("Modelli iPhone offerti da questo Xcode: "
               + ", ".join(sorted(n for n in modelli if n.startswith("iPhone"))))

          nome = next((n for n in [TELEFONO] + RIPIEGHI if n in modelli), None)
          if nome is None:
              nome = next((n for n in sorted(modelli) if n.startswith("iPhone")), None)
          if nome is None:
              sys.exit("Questo Xcode non offre nessun modello di iPhone")
          if nome != TELEFONO:
              nota("ATTENZIONE: " + TELEFONO + " non disponibile, si ripiega su " + nome)

          esistenti = leggi("xcrun", "simctl", "list", "devices", "-j")["devices"]
          gia_pronto = next((d for d in esistenti.get(runtime["identifier"], [])
                             if d["name"] == nome and d.get("isAvailable")), None)
          if gia_pronto:
              udid = gia_pronto["udid"]
          else:
              creato = subprocess.run(
                  ["xcrun", "simctl", "create", nome, modelli[nome], runtime["identifier"]],
                  capture_output=True, text=True, check=True)
              udid = creato.stdout.strip()

          print(udid)
          print(nome + " — iOS " + runtime["version"])
          PY
          python3 /tmp/scegli_simulatore.py > /tmp/simulatore.txt
          UDID=$(sed -n 1p /tmp/simulatore.txt)
          ETICHETTA=$(sed -n 2p /tmp/simulatore.txt)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulatore: $ETICHETTA ($UDID)"
          echo "### Simulatore: $ETICHETTA" >> "$GITHUB_STEP_SUMMARY"

      - name: Compila per il Simulatore
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Vinyl.xcodeproj \
            -scheme Vinyl \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tail -40

      - name: Avvia il Simulatore
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: Installa l'app
        working-directory: ios
        run: |
          APP=$(find build/Build/Products -name 'Vinyl.app' -maxdepth 3 | head -1)
          echo "App: $APP"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"

      - name: Cattura le schermate
        run: |
          mkdir -p screenshots
          # Ogni schermata è un avvio separato con un argomento che dice all'app
          # dove aprirsi: più semplice di automatizzare i tocchi, e non richiede
          # un target di UI test.
          for SCREEN in home library search player album; do
            xcrun simctl terminate "${{ steps.sim.outputs.udid }}" com.gab83126.vinyl 2>/dev/null || true
            xcrun simctl launch "${{ steps.sim.outputs.udid }}" com.gab83126.vinyl \
              -previewScreen "$SCREEN" -previewData YES
            sleep 6
            xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot "screenshots/$SCREEN.png"
            echo "catturata: $SCREEN"
          done
          ls -la screenshots

      - name: "Metro di paragone: un'app di sistema"
        run: |
          # Impostazioni usa lo stesso titolo grande di sistema. Se il suo
          # titolo sta alla stessa altezza del nostro, quell'altezza e' decisa
          # da iOS e non da una spaziatura che abbiamo aggiunto noi.
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" com.apple.Preferences 2>/dev/null || true
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" com.apple.Preferences
          sleep 6
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot "screenshots/riferimento-impostazioni.png"

      - name: Pubblica gli screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-ios
          path: screenshots/
          retention-days: 30
