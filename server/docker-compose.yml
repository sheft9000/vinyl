services:
  vinyl:
    build: .
    container_name: vinyl-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # La libreria e' montata in SOLA LETTURA: il server non puo' toccare i tuoi file.
      - "${MUSIC_DIR:?imposta MUSIC_DIR nel file .env}:/music:ro"
      - "./data:/data"
    environment:
      API_TOKEN: "${API_TOKEN:?imposta API_TOKEN nel file .env}"
      MUSIC_DIR: /music
      DATA_DIR: /data
      # Dentro un container su Windows gli eventi del filesystem non arrivano:
      # meglio disattivare il watcher e usare il pulsante "Riscansiona".
      WATCH_LIBRARY: "false"
